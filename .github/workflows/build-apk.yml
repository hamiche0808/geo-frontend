name: Build Android APK

on:
  push:
    branches: [ master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install --legacy-peer-deps --no-audit --no-fund 2>&1

      - name: Build frontend
        run: npm run build
        env:
          CI: false

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 36
        run: |
          echo y | $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager --install "platforms;android-36" "build-tools;36.0.0" 2>&1 || echo "SDK install may have partially failed, continuing..."

      - name: Install Capacitor
        run: npm install @capacitor/core @capacitor/cli @capacitor/android

      - name: Sync Android platform (already exists)
        run: npx cap sync android

      - name: Copy web build
        run: npx cap copy

      - name: Check SDK
        run: |
          echo "ANDROID_HOME: $ANDROID_HOME"
          echo "ANDROID_SDK_ROOT: $ANDROID_SDK_ROOT"
          echo "SDK platforms installed:"
          ls $ANDROID_HOME/platforms/ 2>/dev/null || echo "No platforms dir"
          echo "Build tools installed:"
          ls $ANDROID_HOME/build-tools/ 2>/dev/null || echo "No build-tools dir"

      - name: Build APK
        run: |
          cd android
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          chmod +x gradlew
          echo "## Gradle version:" >> $GITHUB_STEP_SUMMARY
          ./gradlew --version 2>&1 | head -10 >> $GITHUB_STEP_SUMMARY
          echo "Running assembleDebug..." >> $GITHUB_STEP_SUMMARY
          ./gradlew assembleDebug --stacktrace 2>&1 | tee /tmp/gradle-output.txt | tail -200
          if [ ${PIPESTATUS[0]} -ne 0 ]; then
            echo "## ⛔ Gradle build FAILED" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            tail -100 /tmp/gradle-output.txt >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            exit 1
          fi

      - name: Upload APK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: geo-app-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Create Release
        uses: ncipollo/release-action@v1
        with:
          tag: "v${{ github.run_number }}"
          name: "GeoLoc APK v${{ github.run_number }}"
          body: |
            ## 📱 GeoLoc APK
            
            **Version :** v${{ github.run_number }}
            **Date :** ${{ github.event.head_commit.timestamp || github.event.repository.updated_at }}
            
            ### Installation
            1. Téléchargez le fichier APK ci-dessous
            2. Ouvrez-le sur votre téléphone Android
            3. Autorisez l'installation d'applications provenant de sources inconnues
            4. Profitez de GeoLoc !
            
            *Application web wrapped avec Capacitor. Données : OpenStreetMap · OpenRouteService · Open-Meteo · api.gouv.fr*
          artifact: geo-app-apk
          makeLatest: true
          replacesArtifacts: true
