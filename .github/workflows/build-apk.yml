name: Build Android APK

on:
  push:
    branches: [ master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install --legacy-peer-deps --no-audit --no-fund 2>&1

      - name: Build frontend
        run: npm run build
        env:
          CI: false

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 36
        run: |
          echo y | $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager --install "platforms;android-36" "build-tools;36.0.0" 2>&1

      - name: Install Capacitor
        run: npm install @capacitor/core @capacitor/cli @capacitor/android

      - name: Sync Android platform (already exists)
        run: npx cap sync android

      - name: Copy web build
        run: npx cap copy

      - name: Generate & commit keystore (first run only)
        run: |
          if [ ! -f android/app/geoloc-keystore.jks ]; then
            echo "Keystore not found. Generating a new one..."
            keytool -genkey -v -keystore android/app/geoloc-keystore.jks \
              -alias geoloc -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass geoloc123 -keypass geoloc123 \
              -dname "CN=GeoLoc, OU=Dev, O=GeoLoc, L=Paris, ST=France, C=FR"
            echo "Keystore generated! Committing to repo..."
            git config user.name "GeoBot"
            git config user.email "bot@geoloc.app"
            git add android/app/geoloc-keystore.jks
            git commit -m "Add keystore for APK signing [skip ci]"
            git push origin HEAD:master
            echo "Keystore committed!"
          else
            echo "Keystore already exists, using it."
          fi

      - name: Build APK (release signed)
        run: |
          cd android
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          chmod +x gradlew
          ./gradlew assembleRelease --stacktrace 2>&1
        env:
          KEYSTORE_PASSWORD: 'geoloc123'
          KEY_ALIAS: 'geoloc'
          KEY_PASSWORD: 'geoloc123'
          GITHUB_RUN_NUMBER: ${{ github.run_number }}

      - name: Build APK (debug - for sideloading)
        run: |
          cd android
          ./gradlew assembleDebug --stacktrace 2>&1
        env:
          GITHUB_RUN_NUMBER: ${{ github.run_number }}

      - name: Upload Debug APK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: geo-app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload Release APK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: geo-app-release
          path: android/app/build/outputs/apk/release/app-release.apk

      - name: Upload keystore (for Play Store)
        if: hashFiles('android/app/geoloc-keystore.jks') != ''
        uses: actions/upload-artifact@v4
        with:
          name: geoloc-keystore
          path: android/app/geoloc-keystore.jks

      - name: Create Release
        uses: ncipollo/release-action@v1
        with:
          tag: "v${{ github.run_number }}"
          name: "GeoLoc APK v${{ github.run_number }}"
          body: |
            ## 📱 GeoLoc APK v${{ github.run_number }}
            
            **Date :** ${{ github.event.head_commit.timestamp || github.event.repository.updated_at }}
            
            ### 📥 Téléchargement
            - **APK Debug** (sideloading) : `app-debug.apk` (pièce jointe ci-dessous)
            - **APK Release** (Play Store) : `app-release-unsigned.apk` (doit être signée avec le keystore joint aux artefacts)
            
            ### 📱 Installation directe
            1. Téléchargez `app-debug.apk`
            2. Ouvrez-le sur votre téléphone Android
            3. Autorisez l'installation d'applications provenant de sources inconnues
            
            ### 🏪 Play Store
            Pour publier sur le Play Store :
            1. Récupérez le keystore dans les artefacts du workflow (`geoloc-keystore`)
            2. Ajoutez `KEYSTORE_BASE64` (base64 du keystore) dans les secrets GitHub
            3. Ajoutez `KEYSTORE_PASSWORD`, `KEY_ALIAS`, `KEY_PASSWORD` dans les secrets
            4. Le prochain build produira une APK release signée prête pour le Play Store
            
            *Application web wrapped avec Capacitor. Données : OpenStreetMap · OpenRouteService · Open-Meteo · api.gouv.fr*
          artifacts: "android/app/build/outputs/apk/debug/app-debug.apk,android/app/build/outputs/apk/release/app-release.apk"
          makeLatest: true
          replacesArtifacts: true
