name: Build Android APK

on:
  push:
    branches: [ master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install frontend dependencies
        run: |
          npm install
          npm run build

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Capacitor
        run: npm install @capacitor/core @capacitor/cli @capacitor/android

      - name: Add Android platform
        run: npx cap add android

      - name: Copy web build
        run: npx cap copy

      - name: Build APK
        run: |
          cd android
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          ./gradlew assembleDebug

      - name: Upload APK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: geo-app-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Create Release
        uses: ncipollo/release-action@v1
        with:
          tag: "v${{ github.run_number }}"
          name: "GeoLoc APK v${{ github.run_number }}"
          body: |
            ## 📱 GeoLoc APK
            
            **Version :** v${{ github.run_number }}
            **Date :** ${{ github.event.head_commit.timestamp || github.event.repository.updated_at }}
            
            ### Installation
            1. Téléchargez le fichier APK ci-dessous
            2. Ouvrez-le sur votre téléphone Android
            3. Autorisez l'installation d'applications provenant de sources inconnues
            4. Profitez de GeoLoc !
            
            *Application web wrapped avec Capacitor. Données : OpenStreetMap · OpenRouteService · Open-Meteo · api.gouv.fr*
          artifact: geo-app-apk
          makeLatest: true
          replacesArtifacts: true
